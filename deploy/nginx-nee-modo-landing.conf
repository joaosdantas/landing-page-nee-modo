# Nee MODO landing — modo.nexabee.com.br
# Soft-404 fix: only real files; unknown paths → 404.html (not index.html)

server {
    listen 443 ssl http2;
    server_name modo.nexabee.com.br www.modo.nexabee.com.br;

    # Certbot-managed paths (keep existing certs; prefer modo-specific when available)
    ssl_certificate /etc/letsencrypt/live/homol-plataforma.vbt-assessoria.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homol-plataforma.vbt-assessoria.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www → apex
    if ($host = www.modo.nexabee.com.br) {
        return 301 https://modo.nexabee.com.br$request_uri;
    }

    root /var/www/nee-modo-landing/dist;
    index index.html;

    # Security / SEO headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Real 404 (status preserved) — never fall back to SPA index
    error_page 404 =404 /404.html;
    location = /404.html {
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Exact home
    location = / {
        try_files /index.html =404;
    }

    # Static assets with cache
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|txt|xml|woff2)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Pretty dirs (pillar pages) + files — NO SPA fallback to index.html
    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name modo.nexabee.com.br www.modo.nexabee.com.br;
    return 301 https://modo.nexabee.com.br$request_uri;
}
